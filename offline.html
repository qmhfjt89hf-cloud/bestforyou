<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет подключения</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg,#2f5d4a,#3f6f5e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter,Segoe UI,sans-serif;
            color: #fff;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(18px);
            border-radius: 32px;
            padding: 48px 36px;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        }

            .card img {
                width: 120px;
                margin-bottom: 24px;
            }

        h1 {
            font-size: 26px;
            margin-bottom: 14px;
        }

        p {
            opacity: 0.9;
            margin-bottom: 28px;
        }

        button {
            border: none;
            padding: 14px 32px;
            border-radius: 999px;
            background: #fff;
            color: #2f5d4a;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

            button:hover {
                transform: translateY(-2px);
            }
    </style>
</head>

<body>
    <div class="card">
        <img src="logo.png" alt="Best For You">
        <h1>Нет подключения к интернету</h1>
        <p>Проверьте соединение — сайт откроется автоматически</p>
        <button onclick="location.reload()">Обновить</button>
    </div>
</body>
</html>
